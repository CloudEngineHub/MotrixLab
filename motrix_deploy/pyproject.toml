[build-system]
requires = ["uv_build>=0.11.23,<0.12"]
build-backend = "uv_build"

[project]
name = "motrix-deploy"
version = "0.4.0b0"
description = "Framework-independent policy deployment runtime for MotrixLab."
authors = [{ name = "Motphys", email = "developers@motphys.com" }]
requires-python = "==3.10.*"
readme = "README.md"
license = "Apache-2.0"
dependencies = ["hydra-core>=1.3,<1.4", "motrix-env-core", "numpy>=1.26"]

[project.optional-dependencies]
onnx = ["onnxruntime==1.23.2"]
