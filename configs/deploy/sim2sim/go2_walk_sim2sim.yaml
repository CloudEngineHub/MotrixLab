defaults:
  - _self_
  - override hydra/job_logging: stdout

hydra:
  output_subdir: null
  run:
    dir: .
  sweep:
    dir: .
    subdir: ${hydra.job.num}
  job:
    chdir: false

artifact: ???

backend:
  name: mujoco
  scene: go2-walk-rough
  scene_mode: play
  sim_dt: 0.002
  solver_iterations: 100
  # Absolute world position chosen to clear the deterministic rough terrain at the spawn point.
  base_position: [0.0, 0.0, 0.42]
  base_orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
  base_body_name: base
  imu_site_name: imu
  gyro_sensor_name: gyro
  accelerometer_sensor_name: accelerometer
  global_linear_velocity_sensor_name: global_linvel
  fall_height_m: 0.15
  fall_up_z: 0.5

viewer: true

# Used for headless or non-keyboard backends. Viewer mode uses the focused keyboard instead.
command:
  velocity: [0.0, 0.0, 0.0]

# Leaving both values null runs until the viewer closes or the process is interrupted.
rollout:
  steps: null
  duration_s: null

seed: null
realtime: null
hardware:
  confirm: false
