defaults:
  - _self_
  - override hydra/job_logging: stdout

hydra:
  output_subdir: null
  run:
    dir: .
  sweep:
    dir: .
    subdir: ${hydra.job.num}
  job:
    chdir: false

artifact: ???

backend:
  name: mujoco
  scene: go2-walk-flat
  scene_mode: play
  sim_dt: 0.002
  solver_iterations: 100
  # Keep the deterministic default pose clear of the flat ground at reset.
  base_position: [0.0, 0.0, 0.331]
  base_orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
  base_body_name: base
  imu_site_name: imu
  gyro_sensor_name: gyro
  accelerometer_sensor_name: accelerometer
  global_linear_velocity_sensor_name: global_linvel
  fall_height_m: 0.15
  fall_up_z: 0.5

viewer: true
